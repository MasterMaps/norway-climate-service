- id: senorge_temperature_daily
  name: Daily mean temperature (seNorge 2018)
  short_name: Mean temperature
  standard_name: air_temperature
  variable: tg
  period_type: daily
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [4.5, 57.9, 31.1, 71.2]
    temporal:
      begin: "1957-01-01"
      resolution: P1D
  ingestion:
    plugin: datasets.senorge.SeNorgePlugin
    params:
      variable: tg
  source_crs: EPSG:32633
  units: degC
  cell_methods: "time: mean"
  resolution: 1 km x 1 km
  source: seNorge 2018
  source_url: https://thredds.met.no/thredds/catalog/senorge/seNorge_2018/Archive/catalog.html
  display:
    colormap: rdbu_r
    range: [-30.0, 30.0]
    nodata: -999.99

- id: senorge_precipitation_daily
  name: Daily precipitation (seNorge 2018)
  short_name: Precipitation
  standard_name: lwe_precipitation_rate
  variable: rr
  period_type: daily
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [4.5, 57.9, 31.1, 71.2]
    temporal:
      begin: "1957-01-01"
      resolution: P1D
  ingestion:
    plugin: datasets.senorge.SeNorgePlugin
    params:
      variable: rr
  source_crs: EPSG:32633
  units: mm/d
  cell_methods: "time: mean"
  resolution: 1 km x 1 km
  source: seNorge 2018
  source_url: https://thredds.met.no/thredds/catalog/senorge/seNorge_2018/Archive/catalog.html
  display:
    colormap: blues
    range: [0.0, 50.0]
    nodata: -9999.0
